name: Build APK

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        env:
          MAILBOX_REPO: ${{ secrets.MAILBOX_REPO }}
          MAILBOX_TOKEN: ${{ secrets.MAILBOX_TOKEN }}
        run: gradle assembleDebug --no-daemon
      - name: Name the APK
        run: cp build/outputs/apk/debug/*.apk MukhsApp.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MukhsApp-APK
          path: MukhsApp.apk
      - name: Publish APK as a release (direct download, no zip)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MukhsApp build ${{ github.run_number }}
          files: MukhsApp.apk
          prerelease: true
